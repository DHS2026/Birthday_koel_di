<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শুভ জন্মদিন কোয়েলদি</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('image.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Hind Siliguri', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(8px);
            width: 90%;
            max-width: 600px;
            height: 80vh;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #d81b60;
            font-size: 26px;
            text-align: center;
            margin: 10px 0 15px 0;
            border-bottom: 2px solid #f48fb1;
            padding-bottom: 10px;
        }

        /* গানের প্লেয়ারটি সবার উপরে রাখার স্টাইল */
        audio {
            width: 100%;
            margin-bottom: 15px;
            outline: none;
            border-radius: 10px;
        }

        /* লিরিক্স স্ক্রল হওয়ার জায়গা */
        #lyrics-container {
            flex-grow: 1;
            overflow-y: auto;
            text-align: center;
            padding: 20px;
            scrollbar-width: thin;
            scrollbar-color: #f48fb1 transparent;
            scroll-behavior: smooth;
        }

        /* কাস্টম স্ক্রলবার (Chrome/Edge/Safari) */
        #lyrics-container::-webkit-scrollbar {
            width: 6px;
        }
        #lyrics-container::-webkit-scrollbar-thumb {
            background-color: #f48fb1;
            border-radius: 10px;
        }

        .lyric-line {
            font-size: 20px;
            color: #7f8c8d;
            margin-bottom: 15px;
            transition: all 0.4s ease;
            opacity: 0.5;
        }

        /* যে লাইনটি বাজছে তার স্টাইল */
        .lyric-line.active {
            font-size: 24px;
            color: #c2185b;
            font-weight: 700;
            opacity: 1;
            transform: scale(1.05);
            text-shadow: 0px 0px 10px rgba(194, 24, 91, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>শুভ জন্মদিন কোয়েলদি</h1>
        
        <audio id="audio-player" controls>
            <source src="birtday.mp3" type="audio/mpeg">
            আপনার ব্রাউজার অডিও সাপোর্ট করছে না।
        </audio>

        <div id="lyrics-container">
            </div>
    </div>

    <script>
        const lyricsData = [
            { time: 17, text: "চোখের পলকে মুছে যাক সব বিষাদের সুর," },
            { time: 25, text: "কোয়েলদি, তোমার জীবন হোক সুখে ভরপুর।" },
            { time: 33, text: "আজকের এই শুভ দিনে করি এই প্রার্থনা—" },
            { time: 41, text: "প্রতিটি পদে থাক জয়ের হাসি, পূর্ণ সব কামনা।" },
            
            { time: 52, text: "শুভ জন্মদিন, শুভ জন্মদিন, অফুরন্ত ভালোবাসা," },
            { time: 60, text: "হাসি-খুশিতে রঙিন হোক তোমার জীবনের আশা।" },
            { time: 68, text: "স্বপ্নগুলো ছুঁয়ে যাক নীল আকাশের সীমানা," },
            { time: 76, text: "সুখে-শান্তিতে ভরে থাকুক তোমার প্রতিটি ঠিকানা।" },
            
            { time: 87, text: "ফুলের মতো ফুটে থাকুক তোমার মধুর হাসি," },
            { time: 95, text: "আনন্দেরই সুর বাজুক তোমার সকাল－দুপুর－নিশি।" },
            { time: 103, text: "স্বপ্নের ডানায় ভেসে উঠুক জীবনের প্রতিটি কোণ," },
            { time: 111, text: "সফলতার রঙে রেঙ্গে উঠুক তোমার আগামী ভুবন।" },
            
            { time: 122, text: "শুভ জন্মদিন, শুভ জন্মদিন, অফুরন্ত ভালোবাসা," },
            { time: 130, text: "হাসি-খুশিতে রঙিন হোক তোমার জীবনের আশা।" },
            { time: 138, text: "স্বপ্নগুলো ছুঁয়ে যাক নীল আকাশের সীমানা," },
            { time: 146, text: "সুখে-শান্তিতে ভরে থাকুক তোমার প্রতিটি ঠিকানা।" }
        ];

        const lyricsContainer = document.getElementById('lyrics-container');
        const audioPlayer = document.getElementById('audio-player');

        // লিরিক্সগুলো HTML এ যুক্ত করা
        lyricsData.forEach((line, index) => {
            const p = document.createElement('p');
            p.className = 'lyric-line';
            p.id = `line-${index}`;
            p.innerText = line.text;
            lyricsContainer.appendChild(p);
        });

        // গান চলার সাথে সাথে লাইন হাইলাইট করা
        audioPlayer.addEventListener('timeupdate', () => {
            const currentTime = audioPlayer.currentTime;
            let activeIndex = -1;
            
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime >= lyricsData[i].time) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            if (activeIndex !== -1) {
                const activeLine = document.getElementById(`line-${activeIndex}`);
                if (!activeLine.classList.contains('active')) {
                    document.querySelectorAll('.lyric-line').forEach(line => line.classList.remove('active'));
                    activeLine.classList.add('active');
                    activeLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        });
    </script>
</body>
</html>
