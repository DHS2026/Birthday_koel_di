<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শুভ জন্মদিন কোয়েলদি</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('image.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Hind Siliguri', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-color: #000;
        }

        /* ভাসমান বেলুনের কন্টেইনার */
        #balloon-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* এতে ক্লিক করলে অডিও প্লেয়ারে কোনো সমস্যা হবে না */
            z-index: 99; /* বেলুনগুলো স্ক্রিনের সামনে থাকবে */
            overflow: hidden;
        }

        /* বেলুনের ডিজাইন (CSS শেপ) */
        .balloon {
            position: absolute;
            bottom: -150px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            box-shadow: inset -5px -5px 15px rgba(0, 0, 0, 0.2), 0 0 15px rgba(255, 255, 255, 0.4);
            animation: floatUp linear forwards;
            opacity: 0.85;
        }

        /* বেলুনের নিচের গিঁট */
        .balloon::before {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 10px;
            background-color: inherit; /* বেলুনের যে রঙ, গিঁটেরও সেই রঙ হবে */
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        /* বেলুনের সুতো */
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -60px;
            left: 50%;
            width: 1.5px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.6);
        }

        /* বেলুন ভাসার অ্যানিমেশন */
        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.9;
            }
            50% {
                transform: translateY(-60vh) rotate(10deg);
            }
            100% {
                transform: translateY(-120vh) rotate(-10deg);
                opacity: 0;
            }
        }

        .container {
            background: rgba(20, 5, 25, 0.75); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 105, 180, 0.2);
            width: 90%;
            max-width: 600px;
            height: 70vh;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 20, 147, 0.2);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        h1 {
            color: #ff99cc;
            font-size: 26px;
            text-align: center;
            margin: 10px 0 15px 0;
            border-bottom: 2px solid rgba(244, 143, 177, 0.3);
            padding-bottom: 10px;
            text-shadow: 0 0 8px rgba(255, 153, 204, 0.6);
        }

        audio {
            width: 100%;
            margin-bottom: 15px;
            outline: none;
            border-radius: 10px;
            filter: invert(0.8) hue-rotate(180deg) brightness(1.2);
        }

        #lyrics-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .lyric-line {
            display: none;
            font-size: 28px; 
            color: #ffe6f2; 
            font-weight: 700;
            line-height: 1.6;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #ff1493,
                0 0 20px #ff1493,
                0 0 40px #c2185b,
                0 0 80px #c2185b;
        }

        .lyric-line.active {
            display: block;
            animation: fadeInNeon 0.8s ease-out forwards, pulseNeon 2s infinite alternate;
        }

        #waiting-text {
            font-size: 20px;
            color: #ffb3d9;
            font-weight: 600;
            text-shadow: 0 0 8px rgba(255, 179, 217, 0.6);
            animation: pulseText 1.5s infinite alternate;
        }

        @keyframes fadeInNeon {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(15px);
                filter: brightness(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: brightness(1);
            }
        }

        @keyframes pulseNeon {
            0% {
                text-shadow: 
                    0 0 5px #fff, 0 0 10px #ff1493, 0 0 20px #ff1493,
                    0 0 40px #c2185b, 0 0 80px #c2185b;
            }
            100% {
                text-shadow: 
                    0 0 2px #fff, 0 0 8px #ff69b4, 0 0 15px #ff1493,
                    0 0 30px #c2185b, 0 0 60px #e91e63;
            }
        }

        @keyframes pulseText {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- বেলুন ভাসার কন্টেইনার -->
    <div id="balloon-container"></div>

    <div class="container">
        <h1>꧁ᴴᵃᵖᵖʸ☆ᵇⁱʳᵗʰᵈᵃʸ꧂ শুভ জন্মদিন কোয়েল দি 🎉🎂✨</h1>
        
        <audio id="audio-player" controls>
            <source src="birtday.mp3" type="audio/mpeg">
            আপনার ব্রাউজার অডিও সাপোর্ট করছে না।
        </audio>

        <div id="lyrics-container">
            <p id="waiting-text">🙏 গানটি চালু/প্লে করুন...</p>
        </div>
    </div>

    <script>
        const lyricsData = [
            { time: 17, text: "চোখের পলকে মুছে যাক সব বিষাদের সুর," },
            { time: 25, text: "কোয়েলদি, তোমার জীবন হোক সুখে ভরপুর।" },
            { time: 33, text: "আজকের এই শুভ দিনে করি এই প্রার্থনা—" },
            { time: 41, text: "প্রতিটি পদে থাক জয়ের হাসি, পূর্ণ সব কামনা।" },
            
            { time: 52, text: "শুভ জন্মদিন, শুভ জন্মদিন, অফুরন্ত ভালোবাসা," },
            { time: 60, text: "হাসি-খুশিতে রঙিন হোক তোমার জীবনের আশা।" },
            { time: 68, text: "স্বপ্নগুলো ছুঁয়ে যাক নীল আকাশের সীমানা," },
            { time: 76, text: "সুখে-শান্তিতে ভরে থাকুক তোমার প্রতিটি ঠিকানা।" },
            
            { time: 87, text: "ফুলের মতো ফুটে থাকুক তোমার মধুর হাসি," },
            { time: 95, text: "আনন্দেরই সুর বাজুক তোমার সকাল－দুপুর－নিশি।" },
            { time: 103, text: "স্বপ্নের ডানায় ভেসে উঠুক জীবনের প্রতিটি কোণ," },
            { time: 111, text: "সফলতার রঙে রেঙ্গে উঠুক তোমার আগামী ভুবন।" },
            
            { time: 122, text: "শুভ জন্মদিন, শুভ জন্মদিন, অফুরন্ত ভালোবাসা," },
            { time: 130, text: "হাসি-খুশিতে রঙিন হোক তোমার জীবনের আশা।" },
            { time: 138, text: "স্বপ্নগুলো ছুঁয়ে যাক নীল আকাশের সীমানা," },
            { time: 146, text: "সুখে-শান্তিতে ভরে থাকুক তোমার প্রতিটি ঠিকানা।" }
        ];

        const lyricsContainer = document.getElementById('lyrics-container');
        const audioPlayer = document.getElementById('audio-player');
        const waitingText = document.getElementById('waiting-text');
        const balloonContainer = document.getElementById('balloon-container');
        
        let balloonInterval;

        // লিরিক্স যোগ করা
        lyricsData.forEach((line, index) => {
            const p = document.createElement('p');
            p.className = 'lyric-line';
            p.id = `line-${index}`;
            p.innerText = line.text;
            lyricsContainer.appendChild(p);
        });

        // গান চলার সাথে সাথে লিরিক্স সিঙ্ক করা
        audioPlayer.addEventListener('timeupdate', () => {
            const currentTime = audioPlayer.currentTime;
            let activeIndex = -1;
            
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime >= lyricsData[i].time) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            if (activeIndex !== -1) {
                if (waitingText.style.display !== 'none') {
                    waitingText.style.display = 'none';
                }

                const activeLine = document.getElementById(`line-${activeIndex}`);
                if (!activeLine.classList.contains('active')) {
                    document.querySelectorAll('.lyric-line').forEach(line => line.classList.remove('active'));
                    activeLine.classList.add('active');
                }
            }
        });

        // বেলুন তৈরি করার ফাংশন
        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.classList.add('balloon');

            // বিভিন্ন সাইজ এবং পজিশন
            const size = Math.random() * (70 - 40) + 40; // 40px থেকে 70px এর মধ্যে
            const leftPosition = Math.random() * 90; // 0% থেকে 90% এর মধ্যে
            const animationDuration = Math.random() * (12 - 7) + 7; // 7 থেকে 12 সেকেন্ডের মধ্যে উঠবে

            // মায়াবী/নিয়ন রঙের তালিকা
            const colors = [
                '#ff69b4', // Hot Pink
                '#ff1493', // Deep Pink
                '#da70d6', // Orchid (হালকা বেগুনি)
                '#9370db', // Medium Purple
                '#00ffff', // Cyan (নিয়ন নীল)
            ];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            balloon.style.width = `${size}px`;
            balloon.style.height = `${size * 1.3}px`; // উচ্চতা চওড়ার চেয়ে একটু বেশি হবে
            balloon.style.left = `${leftPosition}vw`;
            balloon.style.backgroundColor = randomColor;
            balloon.style.animationDuration = `${animationDuration}s`;

            balloonContainer.appendChild(balloon);

            // বেলুন স্ক্রিনের বাইরে চলে গেলে মেমরি ফ্রি করার জন্য ডিলিট করা
            setTimeout(() => {
                balloon.remove();
            }, animationDuration * 1000);
        }

        // গান চালু হলে বেলুন তৈরি শুরু হবে (প্রতি ৮০০ মিলিসেকেন্ডে ১টি)
        audioPlayer.addEventListener('play', () => {
            if (!balloonInterval) {
                balloonInterval = setInterval(createBalloon, 800);
            }
        });

        // গান থামলে বা শেষ হলে বেলুন তৈরি বন্ধ হবে
        audioPlayer.addEventListener('pause', () => {
            clearInterval(balloonInterval);
            balloonInterval = null;
        });

        audioPlayer.addEventListener('ended', () => {
            clearInterval(balloonInterval);
            balloonInterval = null;
        });
    </script>
</body>
</html>
