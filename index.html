<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꧁ᴴᵃᵖᵖʸ☆ᵇⁱʳᵗʰᵈᵃʸ꧂ শুভ জন্মদিন কোয়েল দি 🎉🎂✨🍰🥳</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('image.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Hind Siliguri', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(8px);
            width: 90%;
            max-width: 600px;
            height: 70vh;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #d81b60;
            font-size: 26px;
            text-align: center;
            margin: 10px 0 15px 0;
            border-bottom: 2px solid #f48fb1;
            padding-bottom: 10px;
        }

        audio {
            width: 100%;
            margin-bottom: 15px;
            outline: none;
            border-radius: 10px;
        }

        /* লিরিক্স দেখানোর জায়গাটি এখন স্ক্রিনের মাঝখানে থাকবে */
        #lyrics-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* সাধারণ অবস্থায় সব লাইন লুকানো থাকবে */
        .lyric-line {
            display: none;
            font-size: 26px;
            color: #c2185b;
            font-weight: 700;
            line-height: 1.5;
            text-shadow: 0px 4px 10px rgba(194, 24, 91, 0.2);
        }

        /* যে লাইনটি বাজবে শুধু সেটিই দেখা যাবে এবং অ্যানিমেশন হবে */
        .lyric-line.active {
            display: block;
            animation: fadeInScale 0.6s ease-out forwards;
        }

        /* গান শুরু হওয়ার আগের লেখাটির স্টাইল */
        #waiting-text {
            font-size: 20px;
            color: #7f8c8d;
            font-weight: 600;
        }

        /* সুন্দরভাবে ভেসে ওঠার অ্যানিমেশন */
        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>শুভ জন্মদিন কোয়েলদি</h1>
        
        <audio id="audio-player" controls>
            <source src="birtday.mp3" type="audio/mpeg">
            আপনার ব্রাউজার অডিও সাপোর্ট করছে না।
        </audio>

        <div id="lyrics-container">
            <p id="waiting-text">🙏 গানটি চালু/প্লে করুন...</p>
        </div>
    </div>

    <script>
        const lyricsData = [
            { time: 17, text: "চোখের পলকে মুছে যাক সব বিষাদের সুর," },
            { time: 25, text: "কোয়েলদি, তোমার জীবন হোক সুখে ভরপুর।" },
            { time: 33, text: "আজকের এই শুভ দিনে করি এই প্রার্থনা—" },
            { time: 41, text: "প্রতিটি পদে থাক জয়ের হাসি, পূর্ণ সব কামনা।" },
            
            { time: 52, text: "শুভ জন্মদিন, শুভ জন্মদিন, অফুরন্ত ভালোবাসা," },
            { time: 60, text: "হাসি-খুশিতে রঙিন হোক তোমার জীবনের আশা।" },
            { time: 68, text: "স্বপ্নগুলো ছুঁয়ে যাক নীল আকাশের সীমানা," },
            { time: 76, text: "সুখে-শান্তিতে ভরে থাকুক তোমার প্রতিটি ঠিকানা।" },
            
            { time: 87, text: "ফুলের মতো ফুটে থাকুক তোমার মধুর হাসি," },
            { time: 95, text: "আনন্দেরই সুর বাজুক তোমার সকাল－দুপুর－নিশি।" },
            { time: 103, text: "স্বপ্নের ডানায় ভেসে উঠুক জীবনের প্রতিটি কোণ," },
            { time: 111, text: "সফলতার রঙে রেঙ্গে উঠুক তোমার আগামী ভুবন।" },
            
            { time: 122, text: "শুভ জন্মদিন, শুভ জন্মদিন, অফুরন্ত ভালোবাসা," },
            { time: 130, text: "হাসি-খুশিতে রঙিন হোক তোমার জীবনের আশা।" },
            { time: 138, text: "স্বপ্নগুলো ছুঁয়ে যাক নীল আকাশের সীমানা," },
            { time: 146, text: "সুখে-শান্তিতে ভরে থাকুক তোমার প্রতিটি ঠিকানা।" }
        ];

        const lyricsContainer = document.getElementById('lyrics-container');
        const audioPlayer = document.getElementById('audio-player');
        const waitingText = document.getElementById('waiting-text');

        // লিরিক্সগুলো HTML এ যুক্ত করা
        lyricsData.forEach((line, index) => {
            const p = document.createElement('p');
            p.className = 'lyric-line';
            p.id = `line-${index}`;
            p.innerText = line.text;
            lyricsContainer.appendChild(p);
        });

        // গান চলার সাথে সাথে লাইন হাইলাইট করা
        audioPlayer.addEventListener('timeupdate', () => {
            const currentTime = audioPlayer.currentTime;
            let activeIndex = -1;
            
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime >= lyricsData[i].time) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            if (activeIndex !== -1) {
                // প্রথম লাইন শুরু হলে "গানটি চালু করুন..." লেখাটি সরিয়ে দেওয়া
                if (waitingText.style.display !== 'none') {
                    waitingText.style.display = 'none';
                }

                const activeLine = document.getElementById(`line-${activeIndex}`);
                if (!activeLine.classList.contains('active')) {
                    // অন্য সব লাইন লুকিয়ে ফেলা
                    document.querySelectorAll('.lyric-line').forEach(line => line.classList.remove('active'));
                    // শুধু বর্তমান লাইনটি দেখানো
                    activeLine.classList.add('active');
                }
            }
        });
    </script>
</body>
</html>
