<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শুভ জন্মদিন কোয়েলদি</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('image.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Hind Siliguri', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            /* একটি হালকা ডার্ক ওভারলে দেওয়া হলো যাতে নিয়ন আলো ভালো ফোটে */
            background-color: #000;
        }

        .container {
            /* মায়াবী ডার্ক গ্লাস এফেক্ট */
            background: rgba(20, 5, 25, 0.75); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 105, 180, 0.2);
            width: 90%;
            max-width: 600px;
            height: 70vh;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 20, 147, 0.2);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #ff99cc;
            font-size: 26px;
            text-align: center;
            margin: 10px 0 15px 0;
            border-bottom: 2px solid rgba(244, 143, 177, 0.3);
            padding-bottom: 10px;
            /* হেডারে হালকা নিয়ন গ্লো */
            text-shadow: 0 0 8px rgba(255, 153, 204, 0.6);
        }

        audio {
            width: 100%;
            margin-bottom: 15px;
            outline: none;
            border-radius: 10px;
            /* অডিও প্লেয়ারটিকে থিমের সাথে মানানসই করতে */
            filter: invert(0.8) hue-rotate(180deg) brightness(1.2);
        }

        #lyrics-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .lyric-line {
            display: none;
            font-size: 28px; /* একটু বড় করা হলো */
            /* নিয়নের ভেতরের আলো হালকা গোলাপি/সাদা হয় */
            color: #ffe6f2; 
            font-weight: 700;
            line-height: 1.6;
            /* গোলাপি নিয়ন এফেক্ট */
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #ff1493,
                0 0 20px #ff1493,
                0 0 40px #c2185b,
                0 0 80px #c2185b;
        }

        .lyric-line.active {
            display: block;
            animation: fadeInNeon 0.8s ease-out forwards, pulseNeon 2s infinite alternate;
        }

        #waiting-text {
            font-size: 20px;
            color: #ffb3d9;
            font-weight: 600;
            text-shadow: 0 0 8px rgba(255, 179, 217, 0.6);
            animation: pulseText 1.5s infinite alternate;
        }

        /* সুন্দরভাবে ভেসে ওঠা ও নিয়ন জ্বলে ওঠার অ্যানিমেশন */
        @keyframes fadeInNeon {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(15px);
                filter: brightness(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: brightness(1);
            }
        }

        /* মায়াবী পালস বা নিঃশ্বাস নেওয়ার মতো এফেক্ট */
        @keyframes pulseNeon {
            0% {
                text-shadow: 
                    0 0 5px #fff,
                    0 0 10px #ff1493,
                    0 0 20px #ff1493,
                    0 0 40px #c2185b,
                    0 0 80px #c2185b;
            }
            100% {
                text-shadow: 
                    0 0 2px #fff,
                    0 0 8px #ff69b4,
                    0 0 15px #ff1493,
                    0 0 30px #c2185b,
                    0 0 60px #e91e63;
            }
        }

        @keyframes pulseText {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>꧁ᴴᵃᵖᵖʸ☆ᵇⁱʳᵗʰᵈᵃʸ꧂ শুভ জন্মদিন কোয়েল দি 🎉🎂✨</h1>
        
        <audio id="audio-player" controls>
            <source src="birtday.mp3" type="audio/mpeg">
            আপনার ব্রাউজার অডিও সাপোর্ট করছে না।
        </audio>

        <div id="lyrics-container">
            <p id="waiting-text">🙏 গানটি চালু/প্লে করুন...</p>
        </div>
    </div>

    <script>
        const lyricsData = [
            { time: 17, text: "চোখের পলকে মুছে যাক সব বিষাদের সুর," },
            { time: 25, text: "কোয়েলদি, তোমার জীবন হোক সুখে ভরপুর।" },
            { time: 33, text: "আজকের এই শুভ দিনে করি এই প্রার্থনা—" },
            { time: 41, text: "প্রতিটি পদে থাক জয়ের হাসি, পূর্ণ সব কামনা।" },
            
            { time: 52, text: "শুভ জন্মদিন, শুভ জন্মদিন, অফুরন্ত ভালোবাসা," },
            { time: 60, text: "হাসি-খুশিতে রঙিন হোক তোমার জীবনের আশা।" },
            { time: 68, text: "স্বপ্নগুলো ছুঁয়ে যাক নীল আকাশের সীমানা," },
            { time: 76, text: "সুখে-শান্তিতে ভরে থাকুক তোমার প্রতিটি ঠিকানা।" },
            
            { time: 87, text: "ফুলের মতো ফুটে থাকুক তোমার মধুর হাসি," },
            { time: 95, text: "আনন্দেরই সুর বাজুক তোমার সকাল－দুপুর－নিশি।" },
            { time: 103, text: "স্বপ্নের ডানায় ভেসে উঠুক জীবনের প্রতিটি কোণ," },
            { time: 111, text: "সফলতার রঙে রেঙ্গে উঠুক তোমার আগামী ভুবন।" },
            
            { time: 122, text: "শুভ জন্মদিন, শুভ জন্মদিন, অফুরন্ত ভালোবাসা," },
            { time: 130, text: "হাসি-খুশিতে রঙিন হোক তোমার জীবনের আশা।" },
            { time: 138, text: "স্বপ্নগুলো ছুঁয়ে যাক নীল আকাশের সীমানা," },
            { time: 146, text: "সুখে-শান্তিতে ভরে থাকুক তোমার প্রতিটি ঠিকানা।" }
        ];

        const lyricsContainer = document.getElementById('lyrics-container');
        const audioPlayer = document.getElementById('audio-player');
        const waitingText = document.getElementById('waiting-text');

        lyricsData.forEach((line, index) => {
            const p = document.createElement('p');
            p.className = 'lyric-line';
            p.id = `line-${index}`;
            p.innerText = line.text;
            lyricsContainer.appendChild(p);
        });

        audioPlayer.addEventListener('timeupdate', () => {
            const currentTime = audioPlayer.currentTime;
            let activeIndex = -1;
            
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime >= lyricsData[i].time) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            if (activeIndex !== -1) {
                if (waitingText.style.display !== 'none') {
                    waitingText.style.display = 'none';
                }

                const activeLine = document.getElementById(`line-${activeIndex}`);
                if (!activeLine.classList.contains('active')) {
                    document.querySelectorAll('.lyric-line').forEach(line => line.classList.remove('active'));
                    activeLine.classList.add('active');
                }
            }
        });
    </script>
</body>
</html>
