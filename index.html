<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শুভ জন্মদিন কোয়েলদি</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('image.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Hind Siliguri', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* স্ক্রিনের উপরে ডানদিকে টাইমার দেখানোর জন্য */
        #time-tracker {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            z-index: 1000;
        }

        .container {
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(8px);
            width: 90%;
            max-width: 600px;
            height: 70vh;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #d81b60;
            font-size: 26px;
            text-align: center;
            margin: 10px 0 15px 0;
            border-bottom: 2px solid #f48fb1;
            padding-bottom: 10px;
        }

        audio {
            width: 100%;
            margin-bottom: 15px;
            outline: none;
            border-radius: 10px;
        }

        #lyrics-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .lyric-line {
            display: none;
            font-size: 26px;
            color: #c2185b;
            font-weight: 700;
            line-height: 1.5;
            text-shadow: 0px 4px 10px rgba(194, 24, 91, 0.2);
        }

        .lyric-line.active {
            display: block;
            animation: fadeInScale 0.6s ease-out forwards;
        }

        #waiting-text {
            font-size: 20px;
            color: #7f8c8d;
            font-weight: 600;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
</head>
<body>

    <div id="time-tracker">সময়: 0.0s</div>

    <div class="container">
        <h1>শুভ জন্মদিন কোয়েলদি</h1>
        
        <audio id="audio-player" controls>
            <source src="birtday.mp3" type="audio/mpeg">
            আপনার ব্রাউজার অডিও সাপোর্ট করছে না।
        </audio>

        <div id="lyrics-container">
            <p id="waiting-text">গানটি প্লে করুন...</p>
        </div>
    </div>

    <script>
        // এখানে time এর সংখ্যাগুলো আপনাকে গান শুনে পরিবর্তন করতে হবে
        // টেস্ট করার জন্য আমি প্রথম লাইনটি 2 সেকেন্ডে দিয়েছি
        const lyricsData = [
            { time: 2, text: "চোখের পলকে মুছে যাক সব বিষাদের সুর," },
            { time: 10, text: "কোয়েলদি, তোমার জীবন হোক সুখে ভরপুর।" },
            { time: 18, text: "আজকের এই শুভ দিনে করি এই প্রার্থনা—" },
            { time: 25, text: "প্রতিটি পদে থাক জয়ের হাসি, পূর্ণ সব কামনা।" },
            
            { time: 35, text: "শুভ জন্মদিন, শুভ জন্মদিন, অফুরন্ত ভালোবাসা," },
            { time: 42, text: "হাসি-খুশিতে রঙিন হোক তোমার জীবনের আশা।" },
            { time: 50, text: "স্বপ্নগুলো ছুঁয়ে যাক নীল আকাশের সীমানা," },
            { time: 58, text: "সুখে-শান্তিতে ভরে থাকুক তোমার প্রতিটি ঠিকানা।" },
            
            { time: 70, text: "ফুলের মতো ফুটে থাকুক তোমার মধুর হাসি," },
            { time: 78, text: "আনন্দেরই সুর বাজুক তোমার সকাল－দুপুর－নিশি।" },
            { time: 86, text: "স্বপ্নের ডানায় ভেসে উঠুক জীবনের প্রতিটি কোণ," },
            { time: 94, text: "সফলতার রঙে রেঙ্গে উঠুক তোমার আগামী ভুবন।" },
            
            { time: 105, text: "শুভ জন্মদিন, শুভ জন্মদিন, অফুরন্ত ভালোবাসা," },
            { time: 112, text: "হাসি-খুশিতে রঙিন হোক তোমার জীবনের আশা।" },
            { time: 120, text: "স্বপ্নগুলো ছুঁয়ে যাক নীল আকাশের সীমানা," },
            { time: 128, text: "সুখে-শান্তিতে ভরে থাকুক তোমার প্রতিটি ঠিকানা।" }
        ];

        const lyricsContainer = document.getElementById('lyrics-container');
        const audioPlayer = document.getElementById('audio-player');
        const waitingText = document.getElementById('waiting-text');
        const timeTracker = document.getElementById('time-tracker');

        lyricsData.forEach((line, index) => {
            const p = document.createElement('p');
            p.className = 'lyric-line';
            p.id = `line-${index}`;
            p.innerText = line.text;
            lyricsContainer.appendChild(p);
        });

        audioPlayer.addEventListener('timeupdate', () => {
            const currentTime = audioPlayer.currentTime;
            
            // টাইমার আপডেট করা হচ্ছে
            timeTracker.innerText = `সময়: ${currentTime.toFixed(1)}s`;
            
            let activeIndex = -1;
            
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime >= lyricsData[i].time) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            if (activeIndex !== -1) {
                if (waitingText.style.display !== 'none') {
                    waitingText.style.display = 'none';
                }

                const activeLine = document.getElementById(`line-${activeIndex}`);
                if (!activeLine.classList.contains('active')) {
                    document.querySelectorAll('.lyric-line').forEach(line => line.classList.remove('active'));
                    activeLine.classList.add('active');
                }
            }
        });
    </script>
</body>
</html>
